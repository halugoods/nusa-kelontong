name: nusa_kasir
description: "NUSA - Aplikasi Kasir untuk Rumah Makan & Kafe"
publish_to: 'none'
version: 2.2.57+140

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  # v2.2.57+130: supabase_flutter DIGANTI CloudGateway (Cloudflare worker).
  # web_socket_channel = realtime (Durable Objects); http = REST worker.
  web_socket_channel: ^3.0.1
  mobile_scanner: ^6.0.2
  nfc_manager: ^3.0.1
  esc_pos_bluetooth: ^0.4.1
  esc_pos_utils: ^1.1.0
  image: ^3.3.0
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  restart_app: ^1.3.2
  permission_handler: ^11.3.0
  barcode: ^2.2.8
  barcode_widget: ^2.0.0
  qr_flutter: ^4.1.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  http: ^1.2.0
  excel: ^4.0.0
  csv: ^5.0.0
  connectivity_plus: ^6.0.3
  workmanager: ^0.9.0+3
  uuid: ^4.5.1
  intl: ^0.19.0
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  flutter_local_notifications: ^19.0.0
  fl_chart: ^1.2.0
  pdf: ^3.8.4
  local_auth: ^3.0.2
  flutter_svg: ^2.0.17
  image_cropper: ^8.1.0
  webview_flutter: ^4.10.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  sqlite3: ^3.5.0

# NOTE (+130): supabase_flutter dihapus — konflik rxdart dengan
# esc_pos_bluetooth ikut hilang. Override rxdart 0.27.5 tetap dipasang
# untuk esc_pos_bluetooth.
#
# flutter_bluetooth_basic 0.1.7 (dari esc_pos_bluetooth) memakai jcenter() yang
# sudah DIHAPUS di Gradle 9 → build gagal "Could not find method jcenter()".
# Package di-vendor ke packages/flutter_bluetooth_basic dengan build.gradle
# patched (google + mavenCentral, AGP 8.9.1, compileSdk 36).
dependency_overrides:
  rxdart: 0.27.5
  flutter_bluetooth_basic:
    path: packages/flutter_bluetooth_basic

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/kelontong/
    - assets/icons/fnb/
    - assets/icons/laundry/
    - assets/icons/bengkel/
    - assets/icons/salon/
    - assets/icons/apotek/
    - assets/icons/fotocopy/
    - assets/icons/servis/
    - assets/audio/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
